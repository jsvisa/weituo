[server]
host = "0.0.0.0"
port = 8010
metrics_port = 8020

# Run mode: "dynamic" (fetch rules from waf-admin) or "static" (load from waf.yaml).
# Override with --mode or WEITUO_MODE.
mode = "dynamic"

[auth.google]
mode = "disabled"
allowed_domains = []
jwks_url = "https://www.googleapis.com/oauth2/v3/certs"
jwks_cache_secs = 3600

[provider]
# Backend type: "emp_api" (company product) or "waf_admin" (free/self-hosted).
type = "emp_api"
# Chain IDs this server handles.
chain_ids = [1]
# How often to refresh chain metadata (RPC URL) in seconds.
chain_refresh_secs = 3600
# Per-contract rule cache TTL in seconds.
contract_cache_ttl = 10

# Fallback RPC URLs per chain — used when the backend API returns no rpc_url.
# Uncomment and extend as needed.
# [provider.default_chains]
# 1 = "https://eth.llamarpc.com"

[provider.emp_api]
# Base URL of the emp-backend app.
api_url = "http://localhost:3000"
# EMP internal API auth token (x-am-access-token header).
# Set via ETH_WAF__PROVIDER__EMP_API__ACCESS_TOKEN in production.
access_token = ""

[provider.waf_admin]
# Base URL of the self-hosted admin backend (agent-wallet-backend), engine
# contract base — the engine appends /waf/chains and /waf/rules to it
# (contract: docs/openapi.yaml).
api_url = "http://localhost:8010/api/admin/v1"
# X-API-Key for /waf/* auth (admin-side wt_-prefixed machine token; omit when
# the admin runs without WAF_API_KEYS on an intranet). Prefer the env var in
# production:
#   ETH_WAF__PROVIDER__WAF_ADMIN__API_KEY
api_key = ""
# Extra static headers sent with every /waf/* request; an explicit X-API-Key
# entry here wins over api_key. Do not list multiple X-API-Key values (the
# admin reads the first header only) — rotate by swapping api_key.
# [provider.waf_admin.headers]
# X-Trace-Id = "..."

[rpc]
# Optional local RPC URL overrides. The admin engine endpoint /waf/chains is
# the authoritative source; entries here take precedence and skip the HTTP
# lookup.
# [rpc.providers]
# 1 = "https://eth.llamarpc.com"

[simulate]
url = "http://localhost:3000/api/simulate-tx"
rpc_batch_size = 20
# Per-request timeout in seconds for the decoder (simulate) HTTP request.
timeout_secs = 30
# Pro API key for premium RPC access (sent as x-pro-key header).
pro_api_key = ""

[simulate.rpc]

[simulate.api_keys]
etherscan = []
routescan = []

[oracle]
# Optional price feed HTTP endpoint. If empty, $price_of always returns 0.
url = ""
cache_ttl_secs = 30

[allowlist]
# Sender addresses that bypass all rule checks
# addresses = ["0xdead..."]

[scam_list]
# Local file of known scam addresses used by token_op_policy = "deny_scam".
# A scheduled CI bot refreshes this file daily and files an MR when it changes.
path = "config/scam_addresses.json"

[static_rules]
# Rules file and ABI directory for static mode (--mode static).
rules_path = "etc/waf.yaml"
abi_dir    = "etc/abi"

[global_policy]
# Allow contract deployment transactions (tx.to is empty). Default: true.
allow_contract_creation = true
# Allow plain ETH sends (no calldata). Default: true → bypass rule lookup.
allow_native_transfer = true
# ERC20 transfer/approve policy: "allow_all" | "deny_all" | "whitelist" | "require_rule" | "deny_scam".
# "deny_scam" denies approve(address,uint256) when the spender is in the [scam_list] file.
token_op_policy = "allow_all"
transaction_types = [0, 1, 2]
