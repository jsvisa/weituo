name: Release

on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Check tag matches workspace version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name=="weituo-core") | .version')
          if [ "$TAG" != "$VERSION" ]; then
            echo "tag v$TAG does not match workspace version $VERSION" >&2
            exit 1
          fi

      # weituo-core depends on weituo-expr, so expr goes first and the
      # crates.io index needs a moment to see it before core's dependency
      # resolution runs.
      - name: Publish weituo-expr
        run: cargo publish -p weituo-expr

      - name: Wait for crates.io index
        run: sleep 30

      - name: Publish weituo-core
        run: cargo publish -p weituo-core
